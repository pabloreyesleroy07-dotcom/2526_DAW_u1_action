name: CI y Documentacion

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pdoc

      - name: Ejecutar tests unitarios
        run: pytest test_main.py

      - name: Generar documentacion HTML
        run: |
          mkdir -p docs/html
          pdoc -o docs/html main.py

      - name: Generar documentacion Markdown
        run: |
          mkdir -p docs/md
          pdoc main.py > docs/md/main.md

      - name: Subir artefacto de documentacion
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-multiformato
          path: docs/
          retention-days: 7
